<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Hamarosan érkezik_ Karriertérkép</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #fff;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 16px;
      }

      img {
        display: block;
        width: auto;
        height: auto;
        max-width: min(100%, 1450px);
        max-height: calc(100dvh - 32px);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="public/Hamarosan érkezik_ Karriertérkép.png"
        alt="Karriertérkép. Hamarosan érkezik."
      />
    </main>
  </body>
</html>
